<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voltra — Premium Electronics Store, Delivered Fast</title>
    <meta name="description" content="Shop flagship smartphones, laptops, audio, gaming and accessories at Voltra. Genuine stock, flash deals and 2-day delivery." />
    <meta property="og:title" content="Voltra — Premium Electronics Store" />
    <meta property="og:description" content="Flagship phones, laptops, audio and gaming gear with flash deals and fast delivery." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <main class="page">
      <section class="container" style="padding-top: 22px">
        <div class="hero" id="hero"></div>
      </section>

      <section class="section container">
        <div id="categories-head"></div>
        <div class="tiles" id="categories"></div>
      </section>

      <section class="section--tight container">
        <div id="flash-head"></div>
        <div class="grid" id="flash-deals"></div>
      </section>

      <section class="section container">
        <div id="featured-head"></div>
        <div class="grid" id="featured"></div>
      </section>

      <section class="section--tight container">
        <div class="banner" id="promo-banner"></div>
      </section>

      <section class="section container">
        <div id="new-head"></div>
        <div class="grid" id="new-arrivals"></div>
      </section>

      <section class="section--tight container">
        <div id="best-head"></div>
        <div class="grid" id="best-sellers"></div>
      </section>

      <section class="section container">
        <div id="brands-head"></div>
        <div class="tiles" id="brands"></div>
      </section>

      <section class="section--tight container">
        <div id="reviews-head"></div>
        <div class="grid grid--2" id="reviews"></div>
      </section>

      <section class="section container">
        <div class="card card--pad" id="newsletter"></div>
      </section>
    </main>
    <script type="module" src="js/pages/home.js"></script>
  </body>
</html>
